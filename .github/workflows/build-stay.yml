name: Build ZIP para Stay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Garantir assets do Figma
        run: npm run assets

      - name: Gerar build
        run: npm run build

      - name: Persistir build para a Stay
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git add public/assets || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "build: persistir dist para Stay [skip ci]"
            git push
          else
            echo "Build já está atualizado no repositório."
          fi

      - name: Gerar ZIP final para Stay
        shell: bash
        run: |
          cd dist
          zip -r ../maria-lisboa-stay.zip .

      - name: Salvar ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: maria-lisboa-stay
          path: maria-lisboa-stay.zip
          if-no-files-found: error
          retention-days: 30
